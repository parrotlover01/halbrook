<style>
@view-transition{navigation:auto}
::view-transition-old(root),::view-transition-new(root){animation-duration:.35s}
/* Layout: a 2.39:1 cinema frame centred on black; dialogue docked under the image; titles thin and wide-tracked. Single night look by design. */
:root{
  --night:#000;
  --ink:#ece6d8;
  --muted:#9a96a8;
  --brass:#cfa85e;
  --scarlet:#ef5a6f;
  --steel:#a9c0e6;
  --glass:rgba(8,8,12,.82);
  --f-title:"Jost","Futura","Avenir Next",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--night);color:var(--ink);overflow:hidden}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;user-select:none;-webkit-user-select:none}
#frame{position:fixed;inset:0;overflow:hidden;background:#000}
#frame::before{content:"";position:absolute;left:0;right:0;bottom:0;height:42%;z-index:1;pointer-events:none;background:linear-gradient(0deg,rgba(0,0,0,.7),rgba(0,0,0,0))}
#frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .7s ease}
#frame video.on{opacity:1}
#frame.whip video{transition:opacity .28s ease}
#frame video.in-r{animation:inR .5s cubic-bezier(.2,.75,.25,1)}#frame video.in-l{animation:inL .5s cubic-bezier(.2,.75,.25,1)}
#frame video.out-r{animation:outR .5s cubic-bezier(.4,0,.6,1) forwards}#frame video.out-l{animation:outL .5s cubic-bezier(.4,0,.6,1) forwards}
#frame video.in-d{animation:inD .5s cubic-bezier(.2,.75,.25,1)}#frame video.in-u{animation:inU .5s cubic-bezier(.2,.75,.25,1)}
@keyframes inR{from{transform:translateX(30%) scale(1.06);filter:blur(16px)}to{transform:none;filter:none}}
@keyframes inL{from{transform:translateX(-30%) scale(1.06);filter:blur(16px)}to{transform:none;filter:none}}
@keyframes outR{to{transform:translateX(-30%) scale(1.06);filter:blur(16px)}}
@keyframes outL{to{transform:translateX(30%) scale(1.06);filter:blur(16px)}}
@keyframes inD{from{transform:translateY(25%) scale(1.06);filter:blur(14px)}to{transform:none;filter:none}}
@keyframes inU{from{transform:translateY(-25%) scale(1.06);filter:blur(14px)}to{transform:none;filter:none}}
.look{position:absolute;top:50%;transform:translateY(-50%);z-index:3;display:flex;align-items:center;gap:10px;background:none;border:0;padding:18px 14px;cursor:pointer;color:rgba(236,230,216,.55);font:300 10px/1 var(--f-title);letter-spacing:.32em;text-transform:uppercase;opacity:0;transition:opacity .4s,color .2s;pointer-events:none}
.look i{font-style:normal;font-size:22px;letter-spacing:0;font-weight:200}
.look.l{left:0}.look.r{right:0;flex-direction:row-reverse}
.look.d{top:96px;bottom:auto;left:50%;transform:translateX(-50%);flex-direction:column;gap:4px;padding:8px 14px;text-shadow:0 1px 6px rgba(0,0,0,.8)}
#frame.hub .look{opacity:1;pointer-events:auto}
#frame.hub .look:hover{color:var(--ink)}
#frame.hub{cursor:grab}
@media (hover:none){.look span{display:none}}
#grain{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.06;mix-blend-mode:overlay}
#frame::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 75% at 50% 50%,rgba(0,0,0,0) 60%,rgba(0,0,0,.55) 100%)}
.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 92px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:flex-end;align-items:flex-start;gap:12px;z-index:5;pointer-events:none}
.hud-btns{display:flex;gap:8px;pointer-events:auto}
.pill{font:400 11px/1 var(--f-title);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);background:transparent;border:1px solid rgba(236,230,216,.18);border-radius:0;padding:8px 12px;cursor:pointer}
.pill:hover{color:var(--ink);border-color:rgba(236,230,216,.5)}
#ctitle{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none;opacity:0;transition:opacity 1.8s;z-index:2}
#ctitle.on{opacity:1}
#ctitle .k{font:300 11px/1 var(--f-title);letter-spacing:.55em;color:rgba(236,230,216,.7);text-transform:uppercase;margin-right:-.55em}
#ctitle h2{font-family:var(--f-title);font-weight:200;text-transform:uppercase;letter-spacing:.5em;margin:0 -.5em 0 0;font-size:clamp(20px,4.2vw,54px);line-height:1;text-shadow:0 2px 30px rgba(0,0,0,.9)}
#ctitle h2 b{font-weight:400}
#dlg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:min(900px,calc(100% - 32px));box-sizing:border-box;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:12px;z-index:4;text-align:center}
.who{font:500 11px/1 var(--f-body);letter-spacing:.24em;text-transform:uppercase;color:rgba(255,226,92,.75);min-height:11px;text-shadow:0 1px 3px #000}
#line{margin:0;max-width:44ch;font:500 clamp(17px,2.2vw,23px)/1.4 var(--f-body);color:#ffe25c;cursor:pointer;min-height:1.4em;text-wrap:balance;text-shadow:0 0 2px #000,0 0 2px #000,0 2px 6px rgba(0,0,0,.95),0 0 14px rgba(0,0,0,.6);-webkit-text-stroke:.3px rgba(0,0,0,.6)}
#line.narr{font-style:italic;color:#ffe25c}
.who{font-size:12.5px;font-weight:600;letter-spacing:.18em;padding:7px 14px 6px;border-radius:999px;background:rgba(0,0,0,.6);box-shadow:inset 0 0 0 1px currentColor;min-height:0}
.who:empty{visibility:hidden;padding:0;box-shadow:none}
.who.vale{color:#ff9cbc}#line.vale{color:#ffe1ea}
.who.horace{color:#86e39a}#line.horace{color:#d6f7dc}
.who.you{color:#9fd3ff}#line.you{color:#eef7ff}
.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.choice{font:400 14px/1.2 var(--f-body);color:#fff;background:rgba(10,10,12,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(236,230,216,.18);border-radius:0;padding:10px 14px;cursor:pointer;text-align:left}
.choice:hover{border-color:rgba(236,230,216,.6);background:rgba(236,230,216,.05)}
.choice .n{font:400 11px/1 var(--f-mono);color:var(--muted);margin-right:9px}
.choice.cont{color:var(--ink);border-color:rgba(236,230,216,.4);letter-spacing:.04em}
.choice.quiet{color:var(--muted)}
.choice.brief{color:#fff;border-color:rgba(227,37,58,.75);background:linear-gradient(180deg,rgba(227,37,58,.28),rgba(120,10,22,.55));box-shadow:0 0 18px rgba(227,37,58,.25)}
.choice.brief:hover{border-color:#ff5a6c;background:linear-gradient(180deg,rgba(227,37,58,.42),rgba(120,10,22,.65))}
.choice.brief .n{color:#ffb3bb}
.choice:focus-visible,.pill:focus-visible,.go:focus-visible,.dial button:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
.dials{display:flex;gap:6px;padding:8px;background:#14110c;border:1px solid #4a3c22;width:max-content}
.dial{display:flex;flex-direction:column;align-items:center;gap:2px}
.dial button{background:none;border:0;color:var(--brass);font-size:14px;cursor:pointer;padding:3px 12px}
.dial output{font:600 24px/1 var(--f-mono);color:#0c0a06;background:linear-gradient(#efd69c,#b08940);width:36px;text-align:center;padding:8px 0;font-variant-numeric:tabular-nums}
.dial output.cur{box-shadow:0 0 0 2px var(--steel)}
.dial button,.dial output{touch-action:manipulation;-webkit-user-select:none;user-select:none}.dial output{cursor:ns-resize}
@media (pointer:coarse){.dials{gap:8px;padding:10px}.dial button{font-size:18px;padding:12px 16px;min-height:44px}.dial output{width:52px;font-size:32px;padding:12px 0;touch-action:none}}
.card{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px max(16px,env(safe-area-inset-left,0px));background:rgba(0,0,0,.86);z-index:6}
.endc{gap:22px}
.endc .enter{text-decoration:none;background:#fff;color:#000;border-color:#fff;font:500 15px/1 var(--f-body);letter-spacing:.02em;text-transform:none;padding:16px 34px;border-radius:2px}
.endc .enter:hover{background:var(--brass);border-color:var(--brass)}
.endc .replay{background:none;border:0;color:var(--muted);font:400 13px/1 var(--f-body);cursor:pointer;text-decoration:underline;text-underline-offset:4px}
.endc .replay:hover{color:#fff}
.card .k{font:300 11px/1 var(--f-title);letter-spacing:.5em;color:var(--muted);text-transform:uppercase;margin-right:-.5em}
.card h1,.card h2{font-family:var(--f-title);font-weight:200;text-transform:uppercase;letter-spacing:.42em;margin:0 -.42em 0 0;font-size:clamp(20px,4vw,48px);line-height:1.15;text-wrap:balance}
.card h1 b,.card h2 b{font-weight:400}
.card h1::after,.card h2::after{content:"";display:block;width:56px;height:1px;background:rgba(236,230,216,.4);margin:22px auto 0}
.card p{margin:0;color:var(--muted);max-width:52ch}
.keys{display:grid;grid-template-columns:auto auto;gap:6px 16px;font:12px/1.4 var(--f-mono);color:var(--muted);text-align:left}
.keys b{color:var(--ink);font-weight:400}
.go{font:400 12px/1 var(--f-title);letter-spacing:.32em;text-transform:uppercase;color:var(--ink);background:transparent;border:1px solid rgba(236,230,216,.45);border-radius:0;padding:15px 26px 15px calc(26px + .32em);cursor:pointer;transition:background .3s,color .3s}
.go:hover{background:var(--ink);color:#000}
.go:disabled{opacity:.4;cursor:wait}
.hero{position:fixed;inset:0;z-index:6;overflow:hidden;background:#000;transition:opacity 1.2s ease}
.hero.out{opacity:0}
.hero.out #heroOpen{transform:scale(1.14);filter:blur(6px) brightness(.6);transition:transform 1.4s cubic-bezier(.5,0,.3,1),filter 1.4s}
.hero.turn{background:transparent;pointer-events:none}
.hero.turn .hero-hit,.hero.turn .hero-mark{opacity:0;transition:opacity .3s}
.hero.turn::after{opacity:0;transition:opacity .9s}
.hero.turn .hero-bg.on{transition:transform .95s cubic-bezier(.55,0,.35,1),filter .95s,opacity .95s ease-in;transform:perspective(1400px) rotateY(32deg) translateX(-28%) scale(1.35);filter:blur(18px);opacity:0}
.hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s}
.hero-bg.on{opacity:1}
@keyframes drift{to{transform:scale(1.17) translateX(-1%)}}
#heroRain{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;opacity:.8;transition:opacity .8s}
.hero.opening #heroRain{opacity:0}
.hero::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse 85% 80% at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.6) 100%),linear-gradient(0deg,rgba(0,0,0,.55),rgba(0,0,0,0) 30%)}
.hero-hit{position:absolute;inset:78px 0 0;z-index:3;background:none;border:0;cursor:pointer;display:grid;place-items:center}
.hero-hit:disabled{cursor:wait}
.cue{font:300 10px/1 var(--f-title);letter-spacing:.5em;text-transform:uppercase;color:rgba(236,230,216,.75);padding:14px 0 14px .5em;text-shadow:0 1px 10px rgba(0,0,0,.8);transition:opacity .4s}
.hero-hit:not(:disabled) .cue{animation:breathe 3.2s ease-in-out infinite}
.hero-hit:focus-visible .cue{outline:2px solid var(--steel);outline-offset:6px}
@keyframes breathe{50%{opacity:.4}}
.hero.opening .cue,.hero.opening .hero-mark{opacity:0;animation:none}
.hero-mark{position:absolute;z-index:2;left:clamp(16px,3.5vw,48px);bottom:clamp(24px,5vh,48px);pointer-events:none;transition:opacity .6s}
.hero-mark .cap{font:300 10px/1 var(--f-title);letter-spacing:.5em;text-transform:uppercase;color:var(--muted)}
.hero-mark h1{font:200 clamp(16px,1.6vw,22px)/1 var(--f-title);letter-spacing:.5em;text-transform:uppercase;margin:12px 0 0}
.site-top{position:fixed;z-index:9;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:24px;height:78px;padding:env(safe-area-inset-top,0px) clamp(16px,3.5vw,48px) 0;border-bottom:1px solid rgba(236,230,216,.08);background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.18))}
.site-mark{display:flex;align-items:center;gap:14px;color:#fff;text-decoration:none;white-space:nowrap}
.site-mark .logo{width:30px;height:30px;border-radius:8px;margin-right:-2px;box-shadow:0 4px 14px rgba(227,37,58,.35)}
.site-mark b{font:500 20px/1 var(--f-body);letter-spacing:.01em}
.site-mark small{font:400 14px/1 var(--f-body);color:rgba(255,255,255,.78);padding-left:0;border-left:0}
.site-act{display:flex;align-items:center;gap:28px}
.site-nav{display:flex;gap:30px}
.site-nav a{font:500 15px/1 var(--f-body);color:rgba(255,255,255,.82);text-decoration:none;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.site-nav a:hover,.site-nav a[aria-current]{color:#fff}
.site-ico{display:flex;gap:2px;margin-right:-14px}
.snd{background:none;border:0;cursor:pointer;padding:0}
.ico{display:grid;place-items:center;width:40px;height:40px;color:#fff;filter:drop-shadow(0 1px 6px rgba(0,0,0,.6));text-decoration:none}
.ico svg{width:19px;height:19px}
.ico:hover{color:var(--brass)}
.wal{position:relative}
.wal-btn{font:500 15px/1 var(--f-body);color:#000;background:#fff;border:1px solid #fff;border-radius:2px;padding:13px 22px;cursor:pointer;transition:background .2s,color .2s}
.wal-btn:hover{background:var(--brass);border-color:var(--brass);color:#000}
.riddle{position:absolute;right:0;top:calc(100% + 10px);white-space:nowrap;background:#0c0c0f;border:1px solid rgba(239,90,111,.5);color:var(--scarlet);font:400 12px/1 var(--f-body);padding:11px 14px;border-radius:2px;animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.wal-pop{position:absolute;right:0;top:calc(100% + 10px);width:240px;background:#0c0c0f;border:1px solid rgba(236,230,216,.16);border-radius:2px;padding:14px;display:flex;flex-direction:column;gap:6px}
.wal-pop[hidden]{display:none}
.wal-k{font:400 12px/1 var(--f-body);color:var(--muted);margin-bottom:6px}
.wal-pop button{font:400 13px/1 var(--f-body);color:var(--ink);background:none;border:1px solid rgba(236,230,216,.12);border-radius:2px;padding:11px 12px;text-align:left;opacity:.55;cursor:not-allowed}
.wal-pop p{margin:6px 0 0;font-size:12px;color:var(--muted)}
.ico:focus-visible,.wal-btn:focus-visible,.site-nav a:focus-visible,.site-mark:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
@media (max-width:860px){.site-nav,.site-mark small{display:none}}
@media (max-width:420px){.site-ico{display:none}}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:4px;width:120px;height:1px;background:rgba(236,230,216,.12);z-index:3}
#bar i{display:block;height:100%;width:0;background:rgba(236,230,216,.5)}
#err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){#frame video,#ctitle{transition:none;animation:none!important}}
/* phone portrait: show the whole shot, dialogue in the black below */
@media (max-aspect-ratio:1/1){
  #frame video{object-fit:contain;top:-14vh}
  #frame::after{display:none}
  #dlg{bottom:calc(env(safe-area-inset-bottom,0px) + 18px)}
  #line{font-size:18px}
  .choices{flex-direction:column;align-items:stretch;width:100%}
  .choice{padding:13px 14px}
  .look.d{top:auto;bottom:calc(50% - 8vh)}
  .site-top{height:64px}
  .site-mark b{font-size:18px}
  .wal-btn{font-size:14px;padding:11px 16px}
  .hud{top:calc(env(safe-area-inset-top,0px) + 76px)}
  .card{padding:24px 20px}
}
@media (max-width:420px){.site-ico{display:flex;gap:0;margin-right:-8px}.site-ico .ico{width:34px}.site-ico .ico[href*="github"]{display:none}}
.rh-f{display:inline-grid;place-items:center;width:40px;height:44px;color:#fff}.rh-f svg{width:18px;height:18px;fill:currentColor}
html[data-theme="light"] .rh-f{color:#17161b}
</style>

/* ---------- dialogue ---------- */
const CLS = { 'Madame Vale': 'vale', 'Horace': 'horace', 'You': 'you' };

$('lookL').addEventListener('click', () => turn('l')); $('lookR').addEventListener('click', () => turn('r')); $('lookD').addEventListener('click', () => turn(view === 'case' ? 'u' : 'd'));

let digits = [0, 0, 0, 0], di = 0;
function lockUI() {
  return new Promise(res => {

      ],

// Warm the HTTP cache in story order, two files at a time, so the next shots are always ready
// instead of all twenty fighting for the connection at once.
const warmed = new Set(); let warmQ = [], warming = 0;
function warm(names) {
  const slow = navigator.connection && (navigator.connection.saveData || /2g/.test(navigator.connection.effectiveType || ''));
  if (slow) return;
  names.forEach(n => { if (!warmed.has(n)) { warmed.add(n); warmQ.push(n); } });
  const pump = () => { while (warming < 2 && warmQ.length) { const n = warmQ.shift(); warming++;
    fetch(SRC(n), { priority: 'low' }).then(r => r.ok && r.arrayBuffer()).catch(() => {}).finally(() => { warming--; pump(); }); } };
  pump();
}
