<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Halbrook · Admin</title>
<link rel="icon" href="favicon.ico" sizes="any">
<style>
:root{--bg:#050506;--ink:#ece6d8;--muted:#8f8b98;--line:rgba(255,255,255,.09);--ok:#5fd39a;--bad:#ef5a6f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,sans-serif;padding:32px 16px}
main{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{margin:0;font-weight:500;font-size:24px}
.card{padding:20px;border-radius:14px;background:#0f0f13;box-shadow:inset 0 0 0 1px var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.v{font:500 22px ui-monospace,Menlo,monospace;color:#fff}
.ok{color:var(--ok)}.bad{color:var(--bad)}
input{flex:1;min-width:0;background:#0b0b0e;color:#fff;border:1px solid var(--line);border-radius:8px;padding:11px;font:14px ui-monospace,Menlo,monospace}
button{border:0;border-radius:8px;padding:10px 14px;font:600 13px system-ui;cursor:pointer;background:#fff;color:#000}
button.no{background:none;color:var(--bad);box-shadow:inset 0 0 0 1px rgba(239,90,111,.5)}
.row{display:flex;gap:10px;align-items:center}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
code{font:13px ui-monospace,Menlo,monospace}
.muted{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main>
  <h1>Halbrook admin</h1>
  <div class="card row" id="login"><input id="tok" type="password" placeholder="ADMIN_TOKEN" autocomplete="off"><button id="go" type="button">Open</button></div>
  <div class="card" id="solv" hidden></div>
  <div class="card" id="wds" hidden></div>
  <p class="muted">The token stays in this tab only. Close the tab to forget it.</p>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const usd = v => v == null ? '—' : '$' + Number(v).toFixed(2);
let token = sessionStorage.getItem('hb-admin') || '';
const call = (p, o = {}) => fetch(p, { ...o, headers: { Authorization: 'Bearer ' + token } }).then(async r => ({ ok: r.ok, ...(await r.json().catch(() => ({}))) }));
async function load() {
  const s = await call('/api/admin/solvency');
  if (!s.ok) { $('login').hidden = false; $('solv').hidden = $('wds').hidden = true; alert(s.error || 'Not allowed'); return; }
  sessionStorage.setItem('hb-admin', token); $('login').hidden = true; $('solv').hidden = $('wds').hidden = false;
  $('solv').innerHTML = `<div class="row" style="justify-content:space-between;margin-bottom:14px"><b>Reserve</b><span class="${s.ok ? 'ok' : 'bad'}">${s.held == null ? 'test mode, nothing on chain yet' : s.ok ? 'Covered' : 'SHORT: withdrawals paused'}</span></div>
    <div class="grid">
      <div><div class="k">Holds (on chain)</div><div class="v">${usd(s.held)}</div></div>
      <div><div class="k">Owes at market</div><div class="v">${usd(s.owedAtMarket)}</div></div>
      <div><div class="k">Margin</div><div class="v ${s.margin == null ? '' : s.margin >= 0 ? 'ok' : 'bad'}">${usd(s.margin)}</div></div>
      <div><div class="k">Owes at reference</div><div class="v">${usd(s.owedAtReference)}</div></div>
      <div><div class="k">Treasury USDG</div><div class="v">${usd(s.treasuryUsdg)}</div></div>
      <div><div class="k">Hot wallet USDG · ETH</div><div class="v">${usd(s.hotUsdg)} · ${s.hotEth == null ? '—' : s.hotEth.toFixed(4)}</div></div>
    </div><p class="muted">Hot wallet ${s.hotWallet ? `<code>${esc(s.hotWallet)}</code>` : 'not set'} · checked ${esc(new Date(s.checked).toLocaleString())}</p>`;
  const w = await call('/api/admin/withdrawals');
  $('wds').innerHTML = `<b>Withdrawals in progress</b>` + (w.withdrawals && w.withdrawals.length ? `<table><tr><th>#</th><th>To</th><th>USDG</th><th>Status</th><th></th></tr>${w.withdrawals.map(x => `<tr><td>${esc(x.id)}</td><td><code>${esc(x.address.slice(0, 8))}…${esc(x.address.slice(-4))}</code></td><td>${x.usdg.toFixed(2)}</td><td>${esc(x.status)}${x.error ? `<br><span class="muted">${esc(x.error)}</span>` : ''}</td><td>${x.status === 'review' ? `<div class="row"><button data-a="approve" data-id="${esc(x.id)}">Approve</button><button class="no" data-a="reject" data-id="${esc(x.id)}">Reject</button></div>` : ''}</td></tr>`).join('')}</table>` : '<p class="muted">Nothing waiting.</p>');
  $('wds').querySelectorAll('button[data-a]').forEach(b => b.onclick = async () => {
    if (!confirm(b.dataset.a === 'approve' ? 'Send this withdrawal?' : 'Reject and refund this withdrawal?')) return;
    const r = await call(`/api/admin/withdrawals/${b.dataset.id}/${b.dataset.a}`, { method: 'POST' }); if (!r.ok) alert(r.error || 'Failed'); load();
  });
}
$('go').onclick = () => { token = $('tok').value.trim(); load(); };
$('tok').addEventListener('keydown', e => { if (e.key === 'Enter') $('go').click(); });
if (token) load();
</script>
</body>
</html>
